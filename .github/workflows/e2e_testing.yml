name: NTRevo E2E Test Automation Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  e2e-automated-tests:
    name: Execute Playwright E2E User Journey Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Start NTRevo Application Server
        run: |
          node server.js &
          sleep 3
        env:
          PORT: 3000

      - name: Execute E2E User Journey Test Suite
        run: |
          node tests/e2e/user_journey.spec.js

      - name: Verify Traceability Matrix Exists
        run: |
          test -f docs/test_traceability_matrix.md
          echo "Requirements Traceability Matrix verified successfully."
